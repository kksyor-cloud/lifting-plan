# 안드로이드 설치 파일(APK)을 만들어 GitHub Release "apk-latest" 에 올린다.
# 휴대폰에서 Releases 페이지를 열어 APK를 받아 설치하면 된다 (출처를 알 수 없는 앱 설치 허용 필요).
name: Android APK

on:
  push:
    branches: [main, ci/android-apk]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Tests
        run: npm test -- --ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      # 릴리스 빌드는 Expo 템플릿 기본값인 디버그 키로 서명된다. 스토어 배포용이 아니라 직접 설치용이다.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/lifting-plan-${GITHUB_SHA::7}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: lifting-plan-apk
          path: out/*.apk

      - name: Publish to release apk-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 리프팅 플랜 APK (최신)
          prerelease: true
          make_latest: false
          body: |
            ${{ github.ref_name }} 브랜치 ${{ github.sha }} 커밋으로 만든 설치 파일입니다.
            휴대폰에서 아래 APK를 받아 설치하세요. 설치하려면 "출처를 알 수 없는 앱" 설치를 허용해야 합니다.
          files: out/*.apk
